name: Apply Prospecto source update

on:
  push:
    branches:
      - prospecto-1.3.12-update
    paths:
      - '.prospecto-update/update.ready'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply sanitized Prospecto 1.3.12+42 source
        shell: bash
        run: |
          set -euo pipefail
          test -f .prospecto-update/update.ready || exit 0
          cat .prospecto-update/chunk_* > /tmp/prospecto_payload.b64
          base64 --decode /tmp/prospecto_payload.b64 > /tmp/prospecto_payload.tar.xz
          mkdir -p /tmp/prospecto_payload
          tar -xJf /tmp/prospecto_payload.tar.xz -C /tmp/prospecto_payload
          rsync -a /tmp/prospecto_payload/ ./

          # Remove obsolete/sensitive legacy files that are no longer part of the app.
          rm -f android/app/src/main/res/values/google_maps_api.xml
          rm -f lib/core/permissions.dart
          rm -f lib/firebase_storage_service.dart
          rm -f lib/models/prospect_report.dart
          rm -f lib/services/api_keys.dart
          rm -f lib/services/firestore_content_widget2.dart
          rm -f lib/services/places_service.dart
          rm -f lib/services/route_planner.dart
          rm -f lib/ui/buttons.dart

          # Temporary transport files and workflow must not remain in the final source tree.
          rm -rf .prospecto-update
          rm -f .github/workflows/prospecto-apply-update.yml

          git config user.name "Prospecto Update Bot"
          git config user.email "124710758+usasin@users.noreply.github.com"
          git add -A
          git commit -m "Prospecto 1.3.12+42: role-based UX, performance, ads and SEO"
          git push origin HEAD:prospecto-1.3.12-update
