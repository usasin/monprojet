services:
  api:
    build: ..
    image: prospecto-api:0.1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:59851:8000"
    environment:
      PROSPECTO_DATA_DIR: /data
      PROSPECTO_ACCEL_PREFIX: /_prospecto_packs/
    volumes:
      - ${PROSPECTO_HOST_DATA:?Set PROSPECTO_HOST_DATA to the verified absolute data directory}:/data:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
