name: ai_prospect_gps
description: "Application Prospection GPS du Kit Commercial"
publish_to: "none"

version: 1.3.11+41

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  auto_size_text: ^3.0.0
  cloud_firestore: ^5.6.7
  cloud_functions: ^5.5.0
  cupertino_icons: ^1.0.8
  easy_localization: ^3.0.7+1
  firebase_auth: ^5.5.3
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  firebase_storage: ^12.4.5
  fl_chart: ^0.66.0
  flutter_html: ^3.0.0-beta.2
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.1.0
  google_maps_flutter: ^2.10.1
  google_mobile_ads: ^5.3.1
  google_sign_in: ^6.3.0
  http: ^1.3.0
  image_picker: ^1.1.2
  in_app_purchase: ^3.2.3
  intl: ">=0.19.0 <0.21.0"
  location: ^7.0.1
  path_provider: ^2.1.5
  provider: ^6.1.5
  qr_flutter: ^4.1.0
  share_plus: ^11.0.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/translations/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path_android: assets/app_icons/prospecto.png
  image_path_ios: assets/app_icons/prospecto.png
